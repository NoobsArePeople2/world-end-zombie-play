<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World End ZOMBIE Level Editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ccc;
        font-family: monospace;
      }
      #editor {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 24px;
        letter-spacing: 2px;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud .message {
        position: absolute;
        left: 0;
        right: 0;
        top: 16px;
        text-align: center;
        font-size: 24px;
        letter-spacing: 2px;
        color: #ddd;
        text-shadow: 2px 2px 0 #000;
      }
      #hud .weapon {
        position: absolute;
        left: 50%;
        bottom: 56px;
        height: 38vh;
        transform: translateX(-50%);
        image-rendering: pixelated;
        filter: brightness(0.8);
      }
      #hud .problems {
        position: absolute;
        left: 50%;
        top: 56px;
        transform: translateX(-50%);
        max-width: 80vw;
        padding: 12px 20px;
        white-space: pre-wrap;
        font-size: 16px;
        color: #f55;
        background: rgba(0, 0, 0, 0.85);
        border: 2px solid #a22;
      }
      #hud .problems[hidden] {
        display: none;
      }
      #hud .noclip {
        position: absolute;
        right: 16px;
        top: 16px;
        font-size: 20px;
        letter-spacing: 2px;
        color: #3c3;
        text-shadow: 2px 2px 0 #000;
      }
      #hud .noclip[hidden] {
        display: none;
      }
      #hud .selected {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 64px;
        text-align: center;
        font-size: 20px;
        letter-spacing: 2px;
        color: #e33;
        text-shadow: 2px 2px 0 #000;
      }
      #hud .hotbar {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
      }
      #hud .slot {
        position: relative;
        width: 44px;
        height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1614;
        border: 3px solid #3a302a;
        font-size: 24px;
        color: #ddd;
      }
      #hud .slot.on {
        border-color: #e33;
      }
      #hud .slot .number {
        position: absolute;
        left: 2px;
        top: 0;
        font-size: 11px;
        color: #999;
      }
      #picker {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 32px;
        box-sizing: border-box;
        background: #0a0807;
        text-align: center;
      }
      #picker[hidden] {
        display: none;
      }
      #picker h1 {
        margin: 0 0 16px;
        font-size: 44px;
        letter-spacing: 6px;
        color: #b00;
      }
      #picker h2 {
        margin: 24px 0 8px;
        font-size: 18px;
        letter-spacing: 2px;
        color: #e33;
        font-weight: normal;
      }
      #picker .row {
        margin: 6px auto;
      }
      #picker .name {
        display: inline-block;
        min-width: 220px;
        text-align: left;
        font-size: 18px;
      }
      #picker .file {
        display: inline-block;
        min-width: 160px;
        text-align: left;
        color: #888;
      }
      #picker .hint {
        color: #888;
      }
      #picker .notice {
        white-space: pre-wrap;
        color: #f55;
      }
      #picker button {
        margin: 0 4px;
        padding: 6px 16px;
        font: inherit;
        color: #ccc;
        background: #1a1614;
        border: 2px solid #3a302a;
        cursor: pointer;
      }
      #picker button:hover {
        color: #e33;
        border-color: #e33;
      }
      #inventory {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(10, 8, 7, 0.92);
        text-align: center;
      }
      #inventory[hidden] {
        display: none;
      }
      #inventory h2 {
        margin: 16px 0 8px;
        font-size: 20px;
        letter-spacing: 4px;
        color: #e33;
        font-weight: normal;
      }
      #inventory .items {
        display: grid;
        gap: 6px;
        justify-content: center;
      }
      #inventory .cell,
      #inventory .slot {
        box-sizing: border-box;
        background: #1a1614;
        border: 3px solid #3a302a;
        cursor: grab;
        user-select: none;
      }
      #inventory .cell {
        height: 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      #inventory .cell .char {
        font-size: 28px;
      }
      #inventory .cell .label {
        font-size: 12px;
        color: #999;
      }
      #inventory .slots {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      #inventory .slot {
        position: relative;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        cursor: pointer;
      }
      #inventory .slot .number {
        position: absolute;
        left: 3px;
        top: 0;
        font-size: 12px;
        color: #999;
      }
      #inventory .on {
        border-color: #a22;
      }
      #inventory .picked {
        background: #3a2a22;
      }
      #inventory .focus {
        border-color: #e33;
      }
      #inventory .hint {
        margin-top: 24px;
        color: #888;
        font-size: 14px;
      }
      #play {
        position: fixed;
        inset: 0;
        background: #000;
      }
      #play[hidden] {
        display: none;
      }
      #play canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        cursor: pointer;
      }
      /* The game's own screens and HUD, as in index.html, scoped to the play area. */
      #play .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 24px;
        letter-spacing: 2px;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: none;
      }
      #play .overlay[hidden] {
        display: none;
      }
      #play .screen h1 {
        margin: 0 0 24px;
        font-size: 56px;
        letter-spacing: 6px;
        color: #b00;
        text-shadow: 3px 3px 0 #000;
      }
      #play .screen .prompt {
        margin: 0 0 24px;
      }
      #play .screen table {
        margin: 0 auto;
        border-spacing: 24px 6px;
        font-size: 20px;
      }
      #play .screen th {
        text-align: right;
        color: #e33;
        font-weight: normal;
      }
      #play .screen td {
        text-align: left;
      }
      #play .screen table.stats {
        font-size: 32px;
      }
      #play .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #play .hud[hidden] {
        display: none;
      }
      #play .hud .flash {
        position: absolute;
        inset: 0;
        background: #c00;
        opacity: 0;
      }
      #play .hud .crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        box-sizing: content-box;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #fff;
        outline: 1px solid rgba(0, 0, 0, 0.7);
      }
      #play .hud .message {
        position: absolute;
        left: 0;
        right: 0;
        top: 16px;
        text-align: center;
        font-size: 24px;
        letter-spacing: 2px;
        color: #ddd;
        text-shadow: 2px 2px 0 #000;
      }
      #play .hud .weapon {
        position: absolute;
        left: 50%;
        bottom: 56px;
        height: 38vh;
        transform: translateX(-50%);
        image-rendering: pixelated;
        filter: brightness(0.8);
      }
      #play .hud .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 56px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: #1a1614;
        border-top: 3px solid #3a302a;
        font-size: 28px;
        letter-spacing: 2px;
        color: #e33;
        text-shadow: 2px 2px 0 #000;
      }
      #play .hud .label {
        color: #999;
        font-size: 18px;
      }
      #version {
        position: fixed;
        right: 12px;
        bottom: 8px;
        font-size: 12px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 1;
      }
      #overlay.error {
        color: #f55;
        font-size: 16px;
        text-align: left;
        padding: 32px;
        align-items: flex-start;
        justify-content: flex-start;
        background: rgba(0, 0, 0, 0.7);
      }
    </style>
    <script type="module" crossorigin src="./assets/editor-KWNhPPqB.js"></script>
  </head>
  <body>
    <canvas id="editor"></canvas>
    <div id="hud"></div>
    <div id="play" hidden></div>
    <div id="inventory" hidden></div>
    <div id="picker" hidden></div>
    <div id="version"></div>
    <div id="overlay"></div>
  </body>
</html>
